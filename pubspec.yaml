name: dynamic_wrapper_app
description: A highly secured and dynamic Flutter wrapper app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # الحزمة الأساسية لمتطلبات المشروع (الإصدار 6.1.5 كما اتفقنا)
  flutter_inappwebview: ^6.1.5
  
  # حزم Firebase التي سنحتاجها لاحقاً لـ Remote Config و App Check
  firebase_core: ^4.11.0
  firebase_remote_config: ^6.5.3
  firebase_app_check: ^0.4.5
  window_manager: ^0.5.1
  encrypt: ^5.0.3
  http: ^1.6.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  connectivity_plus: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
