name: dynamic_wrapper_app
description: A highly secured and dynamic Flutter wrapper app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # الحزمة الأساسية لمتطلبات المشروع (الإصدار 6.1.5 كما اتفقنا)
  flutter_inappwebview: ^6.1.5
  
  # حزم Firebase التي سنحتاجها لاحقاً لـ Remote Config و App Check
  firebase_core: ^4.10.0
  firebase_remote_config: ^6.5.2
  firebase_app_check: ^0.4.4+2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
